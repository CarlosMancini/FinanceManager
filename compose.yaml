services:
  sql:
    image: ${SQL_IMAGE:?Configure SQL_IMAGE}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_ADMIN_PASSWORD:?Configure SQL_ADMIN_PASSWORD}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    image: ${APP_IMAGE:?Configure APP_IMAGE}
    entrypoint: ["/app/migrate"]
    environment:
      ConnectionStrings__FinanceManager: ${SQL_MIGRATION_CONNECTION_STRING:?Configure SQL_MIGRATION_CONNECTION_STRING}
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  app:
    image: ${APP_IMAGE:?Configure APP_IMAGE}
    environment:
      Container__Enabled: "true"
      ConnectionStrings__FinanceManager: ${SQL_APP_CONNECTION_STRING:?Configure SQL_APP_CONNECTION_STRING}
      Kestrel__Certificates__Default__Path: /certificates/https.pfx
      Kestrel__Certificates__Default__Password: ${HTTPS_CERTIFICATE_PASSWORD:?Configure HTTPS_CERTIFICATE_PASSWORD}
      Security__KeyDirectory: /app/keys
      Security__KeyProtectionCertificate__Path: /certificates/keys.pfx
      Security__KeyProtectionCertificate__Password: ${DATA_PROTECTION_CERTIFICATE_PASSWORD:?Configure DATA_PROTECTION_CERTIFICATE_PASSWORD}
    ports:
      - "127.0.0.1:7043:7043"
    volumes:
      - keys:/app/keys
      - type: bind
        source: ${HTTPS_CERTIFICATE_PATH:?Configure HTTPS_CERTIFICATE_PATH}
        target: /certificates/https.pfx
        read_only: true
      - type: bind
        source: ${DATA_PROTECTION_CERTIFICATE_PATH:?Configure DATA_PROTECTION_CERTIFICATE_PATH}
        target: /certificates/keys.pfx
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sql-data:
  keys:
